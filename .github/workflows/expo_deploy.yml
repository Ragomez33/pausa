name: EAS Update on Main

on:
  push:
    branches:
      - main

jobs:
  update:
    name: Deploy OTA to Expo
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Se recomienda usar LTS de Node para evitar incompatibilidades de C++ en Linux

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Run EAS Update
        run: eas update --auto --branch preview
